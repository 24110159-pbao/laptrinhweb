spring.application.name=ecommerce-mvc

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lwtck?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.curr-code=VND
vnpay.locale=vn

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File Upload
spring.servlet.multipart.max-file-size=${REVIEWS_MEDIA_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${REVIEWS_MEDIA_MAX_REQUEST_SIZE:105MB}
server.tomcat.max-part-count=25

# Review attachments
# Allowlisted image/video formats, maximum 20 MiB per file and 60 seconds per video.
reviews.media.allowed-types=${REVIEWS_MEDIA_ALLOWED_TYPES:image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime}
reviews.media.max-file-size-bytes=${REVIEWS_MEDIA_MAX_FILE_SIZE_BYTES:20971520}
reviews.media.max-video-duration-seconds=${REVIEWS_MEDIA_MAX_VIDEO_DURATION_SECONDS:60}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}

# GHN (Giao Hang Nhanh)
ghn.api.base-url=https://online-gateway.ghn.vn/shiip/public-api
ghn.api.token=${GHN_API_TOKEN:}
ghn.api.shop-id=${GHN_SHOP_ID:}
ghn.api.default-district-id=${GHN_DEFAULT_DISTRICT_ID:1462}
ghn.api.default-ward-code=${GHN_DEFAULT_WARD_CODE:21612}

# Error display
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Checkout
# Inventory is held for 15 minutes by default.
checkout.hold-duration-minutes=${CHECKOUT_HOLD_DURATION_MINUTES:15}
checkout.vnpay-timeout-minutes=${VNPAY_TIMEOUT_MINUTES:15}
checkout.expiry-scan-millis=${CHECKOUT_EXPIRY_SCAN_MILLIS:60000}

# VNPay Transaction Query
vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# Return policy
# Return policy and carrier notifications fail closed until explicitly configured.
returns.allowed-days=${RETURN_WINDOW_DAYS:15}

# UTF-8 Encoding for Web, Thymeleaf, and JSON
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# Forward Headers
server.forward-headers-strategy=framework
