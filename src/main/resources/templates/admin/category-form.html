<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit ? 'Sửa danh mục' : 'Thêm danh mục'}">Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" th:href="@{/admin}">NEXUSTECH ADMIN</a><span class="navbar-text" th:text="${admin.fullName}">Admin</span>
</div></nav>
<main class="container py-4" style="max-width:760px">
    <a th:href="@{/admin/categories}" class="link-secondary text-decoration-none">← Danh sách danh mục</a>
    <h1 class="h3 mt-3 mb-4" th:text="${isEdit ? 'Cập nhật danh mục' : 'Thêm danh mục'}">Danh mục</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
    <form class="card card-body shadow-sm" th:object="${form}"
          th:action="${isEdit} ? @{/admin/categories/{id}/edit(id=${form.id})} : @{/admin/categories/new}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label" for="name">Tên danh mục *</label>
            <input id="name" class="form-control" th:field="*{name}" maxlength="150" required>
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="slug">Slug</label>
            <input id="slug" class="form-control" th:field="*{slug}" maxlength="180"
                   placeholder="Để trống để tự tạo từ tên danh mục">
            <div class="text-danger small" th:errors="*{slug}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Mô tả</label>
            <textarea id="description" class="form-control" th:field="*{description}" rows="5"></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label" for="status">Trạng thái</label>
            <select id="status" class="form-select" th:field="*{status}">
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo danh mục'}">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
