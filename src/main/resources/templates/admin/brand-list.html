<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thương hiệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">NEXUSTECH ADMIN</a>
        <span class="navbar-text" th:text="${admin.fullName}">Admin</span>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h3 mb-1">Quản lý thương hiệu</h1><p class="text-secondary mb-0">Tên, logo và trạng thái thương hiệu.</p></div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Danh mục</a>
            <a class="btn btn-primary" th:href="@{/admin/brands/new}">Thêm thương hiệu</a>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>ID</th><th>Logo</th><th>Tên thương hiệu</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="brand : ${brands}">
                    <td th:text="${brand.id}">1</td>
                    <td>
                        <img th:if="${brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}"
                             th:src="${brand.logoUrl}" th:alt="${brand.name}" style="width:56px;height:40px;object-fit:contain">
                        <span th:unless="${brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}" class="text-secondary">Chưa có logo</span>
                    </td>
                    <td class="fw-semibold" th:text="${brand.name}">Brand</td>
                    <td><span class="badge" th:classappend="${brand.status.name() == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'"
                              th:text="${brand.status}">ACTIVE</span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary"
                                             th:href="@{/admin/brands/{id}/edit(id=${brand.id})}">Sửa</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(brands)}"><td colspan="5" class="text-center text-secondary py-4">Chưa có thương hiệu.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
