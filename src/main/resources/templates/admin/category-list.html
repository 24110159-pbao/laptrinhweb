<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">NEXUSTECH ADMIN</a>
        <span class="navbar-text" th:text="${admin.fullName}">Admin</span>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h3 mb-1">Quản lý danh mục</h1><p class="text-secondary mb-0">Tên, slug, mô tả và trạng thái danh mục.</p></div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/admin/brands}">Thương hiệu</a>
            <a class="btn btn-primary" th:href="@{/admin/categories/new}">Thêm danh mục</a>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>ID</th><th>Tên</th><th>Slug</th><th>Mô tả</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td class="fw-semibold" th:text="${category.name}">Category</td>
                    <td><code th:text="${category.slug}">category</code></td>
                    <td class="text-truncate" style="max-width:300px" th:text="${category.description}">Description</td>
                    <td><span class="badge" th:classappend="${category.status.name() == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'"
                              th:text="${category.status}">ACTIVE</span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary"
                                             th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Sửa</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}"><td colspan="6" class="text-center text-secondary py-4">Chưa có danh mục.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
