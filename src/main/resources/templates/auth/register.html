<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - NEXUSTECH FLAGSHIP STORE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-wrapper">
<header th:replace="~{fragments/site :: header}"></header>

    <div class="auth-ambient-glow"></div>

    <div class="auth-card" style="max-width: 520px;">
        
        <!-- Header -->
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand-badge">
                <div class="brand-icon">⚡</div>
                <div class="brand-title-wrap" style="text-align: left;">
                    <span class="brand-name">NEXUSTECH</span>
                    <span class="brand-tagline">FLAGSHIP STORE</span>
                </div>
            </a>
            <h1 class="auth-title">Đăng Ký Tài Khoản VIP</h1>
            <p class="auth-subtitle">Nhận mã bảo mật OTP qua Email để kích hoạt tài khoản ngay</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage != null}" class="auth-alert auth-alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Lỗi đăng ký!</span>
        </div>

        <!-- Registration Form (Standard Form POST - No AJAX) -->
        <form th:action="@{/register}" th:object="${registerRequest}" method="POST">
            
            <!-- Full Name -->
            <div class="form-group">
                <label for="regFullName" class="form-label">Họ và tên <span style="color:#ef4444;">*</span></label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" 
                           id="regFullName" 
                           th:field="*{fullName}" 
                           class="form-input" 
                           placeholder="Ví dụ: Nguyễn Văn A" 
                           required>
                </div>
                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error-text"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="regEmail" class="form-label">Email nhận OTP <span style="color:#ef4444;">*</span></label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" 
                           id="regEmail" 
                           th:field="*{email}" 
                           class="form-input" 
                           placeholder="Email chính chủ nhận mã OTP" 
                           required>
                </div>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error-text"></div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="regPhone" class="form-label">Số điện thoại</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <input type="tel" 
                           id="regPhone" 
                           th:field="*{phone}" 
                           class="form-input" 
                           placeholder="0912 345 678">
                </div>
                <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error-text"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="regPassword" class="form-label">Mật khẩu <span style="color:#ef4444;">*</span></label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" 
                           id="regPassword" 
                           th:field="*{password}" 
                           class="form-input" 
                           placeholder="Tối thiểu 6 ký tự" 
                           required>
                    <button type="button" class="password-toggle-btn" data-target="regPassword">🔒</button>
                </div>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error-text"></div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="regConfirmPassword" class="form-label">Xác nhận mật khẩu <span style="color:#ef4444;">*</span></label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" 
                           id="regConfirmPassword" 
                           th:field="*{confirmPassword}" 
                           class="form-input" 
                           placeholder="Nhập lại mật khẩu" 
                           required>
                    <button type="button" class="password-toggle-btn" data-target="regConfirmPassword">🔒</button>
                </div>
                <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error-text"></div>
            </div>

            <div style="font-size: 12px; color: #94a3b8; margin: 16px 0; line-height: 1.5;">
                ⚡ Sau khi bấm tiếp tục, hệ thống sẽ gửi <strong>mã OTP 6 chữ số</strong> đến email trên để hoàn tất xác thực đăng ký.
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit">
                <span>Gửi Mã Xác Thực OTP</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <!-- Footer link -->
        <div class="auth-footer-text">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>
        <div style="text-align: center; margin-top: 14px;">
            <a th:href="@{/}" style="font-size: 12px; color: #64748b; text-decoration: none;">&larr; Quay lại trang chủ</a>
        </div>

    </div>

    <script th:src="@{/js/main.js}"></script>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
