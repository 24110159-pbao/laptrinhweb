<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - NEXUSTECH</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-wrapper">

    <div class="auth-ambient-glow"></div>

    <div class="auth-card">
        
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand-badge">
                <div class="brand-icon">⚡</div>
                <div class="brand-title-wrap" style="text-align: left;">
                    <span class="brand-name">NEXUSTECH</span>
                    <span class="brand-tagline">FLAGSHIP STORE</span>
                </div>
            </a>
            <h1 class="auth-title">Thiết Lập Mật Khẩu Mới</h1>
            <p class="auth-subtitle">Nhập mã OTP vừa nhận từ email và mật khẩu mới của bạn</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage != null}" class="auth-alert auth-alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Lỗi!</span>
        </div>

        <div th:if="${infoMessage != null}" class="auth-alert auth-alert-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span th:text="${infoMessage}">Thông báo!</span>
        </div>

        <!-- Form (Standard Form POST - No AJAX) -->
        <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="POST">
            
            <input type="hidden" th:field="*{email}">

            <!-- OTP Code -->
            <div class="form-group">
                <label for="resetOtp" class="form-label">Mã OTP (6 chữ số)</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="text" 
                           id="resetOtp" 
                           th:field="*{otp}" 
                           class="form-input" 
                           placeholder="Nhập 6 số OTP trong email" 
                           maxlength="6"
                           required>
                </div>
                <div th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}" class="form-error-text"></div>
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" 
                           id="newPassword" 
                           th:field="*{newPassword}" 
                           class="form-input" 
                           placeholder="Tối thiểu 6 ký tự" 
                           required>
                    <button type="button" class="password-toggle-btn" data-target="newPassword">🔒</button>
                </div>
                <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="form-error-text"></div>
            </div>

            <!-- Confirm New Password -->
            <div class="form-group">
                <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" 
                           id="confirmNewPassword" 
                           th:field="*{confirmPassword}" 
                           class="form-input" 
                           placeholder="Nhập lại mật khẩu mới" 
                           required>
                    <button type="button" class="password-toggle-btn" data-target="confirmNewPassword">🔒</button>
                </div>
                <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error-text"></div>
            </div>

            <button type="submit" class="btn-auth-submit" style="margin-top: 24px;">
                <span>Cập Nhật Mật Khẩu</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>

        </form>

        <div class="auth-footer-text">
            <a th:href="@{/login}">Quay lại đăng nhập</a>
        </div>

    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
