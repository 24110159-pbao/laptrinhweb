<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NEXUSTECH FLAGSHIP STORE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-wrapper">

    <div class="auth-ambient-glow"></div>

    <div class="auth-card">
        
        <!-- Header -->
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand-badge">
                <div class="brand-icon">⚡</div>
                <div class="brand-title-wrap" style="text-align: left;">
                    <span class="brand-name">NEXUSTECH</span>
                    <span class="brand-tagline">FLAGSHIP STORE</span>
                </div>
            </a>
            <h1 class="auth-title">Đăng Nhập Tài Khoản</h1>
            <p class="auth-subtitle">Trải nghiệm dịch vụ mua sắm thiết bị công nghệ đỉnh cao</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage != null}" class="auth-alert auth-alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Lỗi đăng nhập!</span>
        </div>

        <div th:if="${successMessage != null}" class="auth-alert auth-alert-success">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span th:text="${successMessage}">Thành công!</span>
        </div>


        <!-- Login Form (Standard Form POST - No AJAX) -->
        <form th:action="@{/login}" th:object="${loginRequest}" method="POST">
            
            <!-- Email -->
            <div class="form-group">
                <label for="loginEmail" class="form-label">Địa chỉ Email</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" 
                           id="loginEmail" 
                           th:field="*{email}" 
                           class="form-input" 
                           placeholder="name@example.com" 
                           required>
                </div>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error-text"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="loginPassword" class="form-label">Mật khẩu</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" 
                           id="loginPassword" 
                           th:field="*{password}" 
                           class="form-input" 
                           placeholder="••••••••" 
                           required>
                    <button type="button" class="password-toggle-btn" data-target="loginPassword">🔒</button>
                </div>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error-text"></div>
            </div>

            <!-- Options -->
            <div class="form-options-row">
                <label class="checkbox-label">
                    <input type="checkbox" th:field="*{rememberMe}" style="accent-color: #0284c7;">
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <a th:href="@{/forgot-password}" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit">
                <span>Đăng Nhập Ngay</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <!-- Footer link -->
        <div class="auth-footer-text">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay &amp; nhận OTP</a>
        </div>
        <div style="text-align: center; margin-top: 14px;">
            <a th:href="@{/}" style="font-size: 12px; color: #64748b; text-decoration: none;">&larr; Quay lại trang chủ</a>
        </div>

    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
