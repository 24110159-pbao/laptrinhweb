<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - NEXUSTECH</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-wrapper">

    <div class="auth-ambient-glow"></div>

    <div class="auth-card">
        
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand-badge">
                <div class="brand-icon">⚡</div>
                <div class="brand-title-wrap" style="text-align: left;">
                    <span class="brand-name">NEXUSTECH</span>
                    <span class="brand-tagline">FLAGSHIP STORE</span>
                </div>
            </a>
            <h1 class="auth-title">Khôi Phục Mật Khẩu</h1>
            <p class="auth-subtitle">Nhập email tài khoản để nhận mã OTP đặt lại mật khẩu</p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMessage != null}" class="auth-alert auth-alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Lỗi!</span>
        </div>

        <!-- Form (Standard Form POST - No AJAX) -->
        <form th:action="@{/forgot-password}" method="POST">
            
            <div class="form-group">
                <label for="forgotEmail" class="form-label">Email tài khoản</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" 
                           id="forgotEmail" 
                           name="email" 
                           th:value="${email}" 
                           class="form-input" 
                           placeholder="name@example.com" 
                           required>
                </div>
            </div>

            <button type="submit" class="btn-auth-submit" style="margin-top: 24px;">
                <span>Gửi Mã Khôi Phục</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <div class="auth-footer-text">
            Nhớ mật khẩu rồi? <a th:href="@{/login}">Đăng nhập</a>
        </div>
        <div style="text-align: center; margin-top: 14px;">
            <a th:href="@{/}" style="font-size: 12px; color: #64748b; text-decoration: none;">&larr; Quay lại trang chủ</a>
        </div>

    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
